<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .task-input {
            display: flex;
            flex-direction: column;
            max-width: 400px;
            margin: 0 auto 20px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input, textarea, button {
            margin: 5px 0;
            padding: 10px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #007BFF;
            color: white;
        }

        button:hover {
            background: #0056b3;
        }

        #taskList {
            max-width: 500px;
            margin: 0 auto;
        }

        .task {
            background: white;
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }

        .task.completed h3,
        .task.completed p {
            text-decoration: line-through;
            color: gray;
        }

        .task button {
            margin-right: 10px;
            padding: 6px 12px;
            font-size: 14px;
        }

        .edit-input {
            width: 90%;
        }
    </style>
</head>
<body>
    <h1>To-Do List</h1>

    <div class="task-input">
        <input type="text" id="taskTitle" placeholder="Task Title">
        <textarea id="taskDescription" placeholder="Task Description"></textarea>
        <button id="addTaskBtn">Add Task</button>
    </div>

    <div id="taskList"></div>

    <script>
        const addTaskBtn = document.getElementById("addTaskBtn");
        const taskList = document.getElementById("taskList");

        addTaskBtn.addEventListener("click", () => {
            const title = document.getElementById("taskTitle").value.trim();
            const desc = document.getElementById("taskDescription").value.trim();

            if (title === "" || desc === "") {
                alert("Please enter both title and description.");
                return;
            }

            const taskDiv = document.createElement("div");
            taskDiv.classList.add("task");

            taskDiv.innerHTML = `
                <h3>${title}</h3>
                <p>${desc}</p>
                <button class="completeBtn">Mark as Completed</button>
                <button class="editBtn">Edit</button>
                <button class="deleteBtn">Delete</button>
            `;

            taskList.appendChild(taskDiv);

            // Clear inputs
            document.getElementById("taskTitle").value = "";
            document.getElementById("taskDescription").value = "";

            const completeBtn = taskDiv.querySelector(".completeBtn");
            const editBtn = taskDiv.querySelector(".editBtn");
            const deleteBtn = taskDiv.querySelector(".deleteBtn");

            // Mark as completed / incomplete
            completeBtn.addEventListener("click", () => {
                taskDiv.classList.toggle("completed");
                completeBtn.textContent = taskDiv.classList.contains("completed") 
                    ? "Mark as Incomplete" 
                    : "Mark as Completed";
            });

            // Delete task
            deleteBtn.addEventListener("click", () => {
                taskDiv.remove();
            });

            // Edit task
            editBtn.addEventListener("click", () => {
                const titleElem = taskDiv.querySelector("h3");
                const descElem = taskDiv.querySelector("p");

                if (editBtn.textContent === "Edit") {
                    const titleInput = document.createElement("input");
                    titleInput.value = titleElem.textContent;
                    titleInput.classList.add("edit-input");

                    const descInput = document.createElement("textarea");
                    descInput.value = descElem.textContent;
                    descInput.classList.add("edit-input");

                    taskDiv.insertBefore(titleInput, titleElem);
                    taskDiv.insertBefore(descInput, descElem);
                    titleElem.remove();
                    descElem.remove();

                    editBtn.textContent = "Save";
                } else {
                    const newTitle = taskDiv.querySelector("input").value.trim();
                    const newDesc = taskDiv.querySelector("textarea").value.trim();

                    if (newTitle === "" || newDesc === "") {
                        alert("Both fields are required!");
                        return;
                    }

                    const newTitleElem = document.createElement("h3");
                    newTitleElem.textContent = newTitle;

                    const newDescElem = document.createElement("p");
                    newDescElem.textContent = newDesc;

                    const inputFields = taskDiv.querySelectorAll(".edit-input");
                    inputFields.forEach(field => field.remove());

                    taskDiv.insertBefore(newTitleElem, taskDiv.querySelector(".completeBtn"));
                    taskDiv.insertBefore(newDescElem, taskDiv.querySelector(".completeBtn"));

                    editBtn.textContent = "Edit";
                }
            });
        });
    </script>
</body>
</html>
